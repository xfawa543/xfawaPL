name: XCLA Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  xcla:
    name: Verify XCLA
    runs-on: ubuntu-latest

    steps:
      - name: Check XCLA acceptance
        id: xcla
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            const requiredText =
              "I have read, understood, and agreed to XCLA v1.0.";

            if (!body.includes(requiredText)) {
              core.setFailed(
                "XCLA v1.0 acceptance was not found in the pull request description."
              );
              return;
            }

            console.log("XCLA v1.0 acceptance verified.");

      - name: Approve pull request
        if: steps.xcla.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const reviewBody =
              "XCLA v1.0 acceptance verified automatically. " +
              "The contributor has explicitly confirmed acceptance in the pull request description.";

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              event: "APPROVE",
              body: reviewBody
            });

            console.log("Pull request approved.");

      - name: XCLA check failed
        if: failure()
        run: |
          echo "XCLA verification failed."
          echo "Please read XCLA.md and confirm acceptance in the PR description."
